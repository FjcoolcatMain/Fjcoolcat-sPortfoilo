<!DOCTYPE html>
<html>
<head>
  <title>My Portfolio</title>
  <style>
    body { font-family: Arial; margin: 0; padding: 0; }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    section {
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }

    .box {
      border: 1px solid #ddd;
      padding: 15px;
      margin-top: 10px;
    }

    #editor {
      display: none;
      margin-top: 20px;
      background: #f4f4f4;
      padding: 15px;
    }

    textarea {
      width: 100%;
      height: 100px;
    }

    button {
      padding: 10px 15px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>My Portfolio</h1>
</header>

<section>

  <h2>About Me</h2>
  <div class="box" id="aboutText">
    I am a web developer passionate about building websites.
  </div>

  <h2>Projects</h2>
  <div class="box" id="projectText">
    - Portfolio Website<br>
    - Small JavaScript Apps<br>
  </div>

  <button onclick="toggleEditor()">Edit Mode</button>

  <div id="editor">
    <h3>Edit Content (Local Only)</h3>

    <p>About:</p>
    <textarea id="aboutInput"></textarea>

    <p>Projects:</p>
    <textarea id="projectInput"></textarea>

    <button onclick="save()">Save</button>
  </div>

</section>

<script>
function toggleEditor() {
  const editor = document.getElementById("editor");

  if (editor.style.display === "none" || editor.style.display === "") {
    editor.style.display = "block";

    document.getElementById("aboutInput").value =
      document.getElementById("aboutText").innerText;

    document.getElementById("projectInput").value =
      document.getElementById("projectText").innerText;
  } else {
    editor.style.display = "none";
  }
}

function save() {
  document.getElementById("aboutText").innerText =
    document.getElementById("aboutInput").value;

  document.getElementById("projectText").innerText =
    document.getElementById("projectInput").value;

  alert("Saved (only in your browser)");
}
</script>

</body>
</html>
