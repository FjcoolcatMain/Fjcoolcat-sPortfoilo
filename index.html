<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Portfolio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

header {
  padding: 40px;
  text-align: center;
  background: #111827;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #1e293b;
  padding: 15px;
  margin: 10px 0;
  border-radius: 10px;
}

button {
  padding: 10px;
  background: #38bdf8;
  border: none;
  cursor: pointer;
  border-radius: 6px;
  margin-top: 10px;
}

#editor {
  display: none;
  background: #111827;
  padding: 15px;
  border-radius: 10px;
  margin-top: 20px;
}

input, textarea {
  width: 100%;
  margin: 5px 0;
  padding: 10px;
}
</style>
</head>

<body>

<header>
  <h1>My Portfolio</h1>
  <p>Web Developer • Designer • Creator</p>
</header>

<div class="container">

  <h2>About Me</h2>
  <div class="card" id="about">
    I build modern, clean, and responsive websites.
  </div>

  <h2>Projects</h2>
  <div id="projects"></div>

  <button onclick="toggleEditor()">Edit Mode</button>

  <div id="editor">
    <h3>Edit Content (Local Only)</h3>

    <textarea id="aboutInput"></textarea>

    <input id="projectInput" placeholder="New project name">
    <button onclick="addProject()">Add Project</button>
  </div>

</div>

<script>

let projects = JSON.parse(localStorage.getItem("projects")) || [
  "Portfolio Website",
  "Weather App",
  "Todo App"
];

function render() {
  const container = document.getElementById("projects");
  container.innerHTML = "";

  projects.forEach(p => {
    container.innerHTML += `
      <div class="card">${p}</div>
    `;
  });
}
render();

/* ===== EDIT MODE (HIDDEN TOOL) ===== */
function toggleEditor() {
  const e = document.getElementById("editor");

  e.style.display = e.style.display === "block" ? "none" : "block";

  document.getElementById("aboutInput").value =
    document.getElementById("about").innerText;
}

/* ===== ADD PROJECT ===== */
function addProject() {
  let val = document.getElementById("projectInput").value;
  if (val) {
    projects.push(val);
    localStorage.setItem("projects", JSON.stringify(projects));
    render();
  }
}

</script>

</body>
</html>
