<!DOCTYPE html>
<html>
<head>
  <title>My Website</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 80px; }
    #adminPanel { display: none; margin-top: 20px; }
    input { padding: 10px; margin: 5px; }
    button { padding: 10px 15px; cursor: pointer; }
  </style>
</head>
<body>

<h1>Welcome to My Website</h1>

<div id="loginBox">
  <h3>Admin Login</h3>
  <input type="text" id="user" placeholder="Username"><br>
  <input type="password" id="pass" placeholder="Password"><br>
  <button onclick="login()">Login</button>
  <p id="msg"></p>
</div>

<div id="adminPanel">
  <h2>Admin Panel</h2>
  <p>You are now "logged in"</p>
  <textarea rows="6" cols="40">Edit content here...</textarea>
</div>

<script>
function login() {
  const user = document.getElementById("user").value;
  const pass = document.getElementById("pass").value;

  // ❌ THIS IS NOT SECURE (visible in source code)
  if (user === "Fj121" && pass === "121") {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";
  } else {
    document.getElementById("msg").innerText = "Wrong login";
  }
}
</script>

</body>
</html>
